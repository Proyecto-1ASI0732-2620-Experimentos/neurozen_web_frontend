server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Equivalente a /actuator/health de la guía (smoke test)
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "UP";
    }

    # Vue Router en modo history: toda ruta vuelve a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
