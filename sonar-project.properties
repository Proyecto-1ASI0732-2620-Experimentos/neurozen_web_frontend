# Organización y project key se envían desde el pipeline (vars.SONAR_ORG y vars.SONAR_PROJECT_KEY)
sonar.sources=src,api,server
sonar.tests=tests
sonar.exclusions=**/node_modules/**,dist/**,coverage/**,public/**
sonar.coverage.exclusions=src/main.js,**/*.config.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
